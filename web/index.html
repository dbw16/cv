<style>
  :root {
    --bg: #f2f0ec;
    --bg-grad: #e8e5df;
    --fg: #1b1a18;
    --muted: #6d6862;
    --rule: #d8d4cd;
    --accent: #2c4a6e;
    --accent-fg: #ffffff;
    --chip-bg: #ffffff;
    --shadow: 0 1px 2px rgba(28, 25, 20, .10), 0 10px 30px -6px rgba(28, 25, 20, .18);
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #15171a;
      --bg-grad: #101215;
      --fg: #e9e7e3;
      --muted: #979289;
      --rule: #2c2f34;
      --accent: #8fb4dd;
      --accent-fg: #10171f;
      --chip-bg: #1d2025;
      --shadow: 0 1px 2px rgba(0, 0, 0, .5), 0 14px 40px -8px rgba(0, 0, 0, .65);
    }
  }

  * { box-sizing: border-box; }

  html { -webkit-text-size-adjust: 100%; }

  body {
    margin: 0;
    padding: 0 20px 72px;
    background: linear-gradient(var(--bg), var(--bg-grad) 620px);
    background-attachment: fixed;
    color: var(--fg);
    font: 16px/1.55 ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .wrap { max-width: 860px; margin: 0 auto; }

  header {
    padding: 64px 4px 30px;
    border-bottom: 1px solid var(--rule);
    margin-bottom: 34px;
  }

  h1 {
    margin: 0;
    font-size: clamp(2rem, 6vw, 2.9rem);
    font-weight: 600;
    letter-spacing: -.023em;
    line-height: 1.1;
  }

  .tagline {
    margin: 12px 0 0;
    max-width: 58ch;
    color: var(--muted);
    font-size: 1.03rem;
  }

  .meta {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 24px;
    align-items: center;
  }

  .chip {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    padding: 7px 13px;
    border: 1px solid var(--rule);
    border-radius: 999px;
    background: var(--chip-bg);
    color: var(--fg);
    font-size: .875rem;
    text-decoration: none;
    transition: border-color .15s ease, transform .15s ease;
  }

  a.chip:hover { border-color: var(--accent); transform: translateY(-1px); }

  .chip svg { width: 15px; height: 15px; flex: none; opacity: .72; }

  .download {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--accent-fg);
    font-weight: 550;
  }

  a.download:hover { border-color: var(--accent); filter: brightness(1.1); }

  .download svg { opacity: 1; }

  /* The rendered CV pages — each an A4 sheet of "paper". */
  .pages {
    display: flex;
    flex-direction: column;
    gap: 26px;
  }

  .sheet {
    display: block;
    width: 100%;
    height: auto;
    background: #fff;
    border-radius: 3px;
    box-shadow: var(--shadow);
  }

  footer {
    margin-top: 44px;
    padding-top: 20px;
    border-top: 1px solid var(--rule);
    color: var(--muted);
    font-size: .82rem;
    display: flex;
    flex-wrap: wrap;
    gap: 6px 14px;
  }

  footer a { color: inherit; }

  @media (max-width: 640px) {
    body { padding: 0 12px 48px; }
    header { padding-top: 44px; }
    .pages { gap: 16px; }
  }

  /* Printing the web page should yield the sheets alone, no site chrome. */
  @media print {
    body { padding: 0; background: #fff; }
    header, footer { display: none; }
    .pages { gap: 0; }
    .sheet { box-shadow: none; border-radius: 0; page-break-after: always; }
  }
</style>
</head>
